<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Private preview</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #fcfdf5; font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #2b1a14; }
  form { width: min(340px, calc(100vw - 32px)); display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  p { margin: 0; font-size: 14px; color: #6b5a52; }
  input { height: 46px; padding: 0 14px; border: 1px solid #cdbfb7; border-radius: 6px; font: inherit; background: #fff; }
  input:focus { outline: 2px solid #5c0509; outline-offset: 1px; }
  button { height: 46px; border: 0; border-radius: 6px; background: #5c0509; color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: #6b5a52; }
  .err { min-height: 20px; color: #a30303; font-size: 14px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Private preview</h1>
  <p>Enter the password to continue.</p>
  <input id="pw" type="password" aria-label="Password" placeholder="Password" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" style="height:auto"> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const SALT = "K+rKGb3YX0hz5tQcUoQmKg==", IV = "PCB0OlBjdgY68KDg";
const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
const KEY_STORE = 'pp-key-' + SALT.slice(0, 8);
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(SALT), iterations: 600000 }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const parts = await Promise.all(['content-1.bin', 'content-2.bin'].map(async (u) => new Uint8Array(await (await fetch(u, { cache: 'no-store' })).arrayBuffer())));
  const buf = new Uint8Array(parts[0].length + parts[1].length); buf.set(parts[0]); buf.set(parts[1], parts[0].length);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, buf);
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) { try { go.disabled = true; await open(b64(saved)); return; } catch (e) { go.disabled = false; try { localStorage.removeItem(KEY_STORE); sessionStorage.removeItem(KEY_STORE); } catch (_) {} } }
})();
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Opening…';
  try {
    const remember = document.getElementById('rem').checked;
    const raw = await deriveRaw(document.getElementById('pw').value);
    const s = btoa(String.fromCharCode(...raw));
    await open(raw);
    try { (remember ? localStorage : sessionStorage).setItem(KEY_STORE, s); } catch (_) {}
  } catch (x) {
    go.disabled = false; go.textContent = 'Open'; err.textContent = 'That password is not right.';
  }
});
</script>
</body>
</html>
